*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050617;color:#fff}
body{overflow-x:hidden}
.page{display:none;position:relative;width:100%;line-height:0;background:#050617}
.page.active{display:block}
.page-img{display:block;width:100%;height:auto;max-width:none;image-rendering:auto}
.hot{position:absolute;z-index:10;display:block;background:transparent;cursor:pointer}
.hot:hover{outline:1px solid rgba(255,27,189,.45);box-shadow:0 0 16px rgba(255,27,189,.2)}
.form-input{
 position:absolute;z-index:20;border:0;outline:0;background:transparent;color:#fff;
 font:500 15px Arial,sans-serif;padding:6px 8px;line-height:1.2;
}
.form-input:focus{background:rgba(8,10,45,.32);border-radius:4px;box-shadow:0 0 0 1px rgba(18,207,255,.55)}
.form-message{position:absolute;z-index:20;border:0;outline:0;background:transparent;color:#fff;resize:none;
font:500 14px Arial,sans-serif;padding:8px;line-height:1.35}
.form-select{position:absolute;z-index:20;background:transparent;color:#fff;border:0;outline:0;font:500 14px Arial,sans-serif}
.toast{
 position:fixed;right:18px;bottom:18px;z-index:1000;display:none;
 background:rgba(5,6,23,.95);border:1px solid #ff1bbd;border-radius:7px;
 padding:12px 16px;font:600 14px Arial,sans-serif;box-shadow:0 0 25px rgba(255,27,189,.35)
}
.detail-wrap{width:100%;background:#050617;display:none;position:relative}
.detail-wrap.active{display:block}
.detail-wrap img{display:block;width:100%;height:auto}
.detail-hot{position:absolute;z-index:10;display:block;background:transparent}
@media(max-width:700px){
 .form-input{font-size:13px}.form-message{font-size:12px}.form-select{font-size:12px}
}
</style>

<div class="toast" id="toast"></div>

<script>
const pages=['home','entreprise','produits','boutique','equipe','contact','formulaire'];
function setPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('detail').classList.remove('active');
  if(/^product-\d+$/.test(id)){
    document.getElementById('detail').classList.add('active');
  } else {
    const p=document.getElementById(id);
    (p||document.getElementById('home')).classList.add('active');
  }
  window.scrollTo(0,0);
}
function route(){
  let id=location.hash.slice(1)||'home';
  if(!pages.includes(id) && !/^product-\d+$/.test(id)) id='home';
  setPage(id);
}
function submitContact(e){
  e.preventDefault();
  const toast=document.getElementById('toast');
  toast.textContent='Message saisi et prêt à être envoyé.';
  toast.style.display='block';
  setTimeout(()=>toast.style.display='none',3000);
}
window.addEventListener('hashchange',route);
route();

// Product-detail navigation: clicking each tile opens its corresponding panel in the exact supplied 3x3 reference.
const zones=document.getElementById('detailZones');
for(let i=0;i<9;i++){
  const a=document.createElement('a');
  const r=Math.floor(i/3),c=i%3;
  a.className='detail-hot';
  a.href='#product-'+(i+1);
  a.style.left=(c*33.333)+'%';
  a.style.top=(r*33.333)+'%';
  a.style.width='33.333%';
  a.style.height='33.333%';
  zones.appendChild(a);
}
</script>
