<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMG · Rétro par passion. Immersif par vision.</title>
<meta name="description" content="EMG : accessoires gaming et VR, et un complexe immersif à Reims. Rétro par passion. Immersif par vision.">
<meta name="theme-color" content="#050617">
<meta property="og:title" content="EMG · Rétro par passion. Immersif par vision.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050617'/%3E%3Cpath fill='%2300D4F0' d='M3 3h10v2H5v2h6v2H5v2h8v2H3z'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050617;color:#fff}
body{overflow-x:hidden}
.page{display:none;position:relative;width:100%;line-height:0;background:#050617}
.page.active{display:block}
.page-img{display:block;width:100%;height:auto;max-width:none;image-rendering:auto}
.hot{position:absolute;z-index:10;display:block;background:transparent;cursor:pointer}
.hot:hover{outline:1px solid rgba(255,27,189,.45);box-shadow:0 0 16px rgba(255,27,189,.2)}
.form-input{
 position:absolute;z-index:20;border:0;outline:0;background:transparent;color:#fff;
 font:500 15px Arial,sans-serif;padding:6px 8px;line-height:1.2;
}
.form-input:focus{background:rgba(8,10,45,.32);border-radius:4px;box-shadow:0 0 0 1px rgba(18,207,255,.55)}
.form-message{position:absolute;z-index:20;border:0;outline:0;background:transparent;color:#fff;resize:none;
font:500 14px Arial,sans-serif;padding:8px;line-height:1.35}
.form-select{position:absolute;z-index:20;background:transparent;color:#fff;border:0;outline:0;font:500 14px Arial,sans-serif}
.toast{
 position:fixed;right:18px;bottom:18px;z-index:1000;display:none;
 background:rgba(5,6,23,.95);border:1px solid #ff1bbd;border-radius:7px;
 padding:12px 16px;font:600 14px Arial,sans-serif;box-shadow:0 0 25px rgba(255,27,189,.35)
}
.detail-wrap{width:100%;background:#050617;display:none;position:relative}
.detail-wrap.active{display:block}
.detail-wrap img{display:block;width:100%;height:auto}
.detail-hot{position:absolute;z-index:10;display:block;background:transparent}
@media(max-width:700px){
 .form-input{font-size:13px}.form-message{font-size:12px}.form-select{font-size:12px}
}

html{scroll-behavior:smooth}
.page.active,.detail-wrap.active{animation:pagein .28s ease-out}
@keyframes pagein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.page.active,.detail-wrap.active{animation:none}}
.page-img,.detail-wrap img{aspect-ratio:2/3;background:#0b0826}
.hot{border-radius:6px;transition:background .15s,box-shadow .15s}
.hot:hover{outline:0;background:rgba(255,255,255,.07);box-shadow:0 0 18px rgba(255,27,189,.28)}
.hot:focus-visible,.detail-hot:focus-visible{outline:2px solid #12cfff;outline-offset:2px}
#bar{position:fixed;left:0;top:0;width:100%;height:7.45vw;z-index:50;background:#050617 top center/100% auto no-repeat;box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .2s}
#bar.scrolled{box-shadow:0 6px 24px rgba(0,0,0,.55)}
#bar a{position:absolute;top:0;height:100%;border-radius:6px}
#bar a:hover{background:rgba(255,255,255,.06)}
#bar a:focus-visible{outline:2px solid #12cfff;outline-offset:-3px}
.skip{position:fixed;left:-999px;top:8px;z-index:99;background:#fff;color:#000;padding:8px 12px;font:600 14px Arial,sans-serif;border-radius:4px}
.skip:focus{left:8px}
.form-input,.form-message,.form-select{border-radius:6px;padding-left:14px;font-size:clamp(9px,1.05vw,15px)}
.form-input::placeholder,.form-message::placeholder{color:transparent}
.form-input:not(:placeholder-shown),.form-message:not(:placeholder-shown),.form-input:focus,.form-message:focus,.form-select:focus,.form-select:valid{background:#10134a;box-shadow:0 0 0 1px rgba(18,207,255,.55)}
.form-select{color:transparent;cursor:pointer;appearance:none;-webkit-appearance:none}
.form-select:focus,.form-select:valid{color:#fff}
.form-select option{color:#fff;background:#10134a}
</style>
</head>
<body>

<a class="skip" href="#home">Aller à l'accueil</a>
<nav id="bar" aria-label="Navigation principale">
<a style="left:3.3%;width:10%" href="#home" aria-label="EMG, accueil"></a>
<a style="left:18%;width:10%" href="#entreprise" aria-label="Entreprise"></a>
<a style="left:29%;width:9%" href="#produits" aria-label="Produits"></a>
<a style="left:39%;width:11%" href="#boutique" aria-label="Boutique, notre complexe"></a>
<a style="left:50%;width:14%" href="#equipe" aria-label="Qui sommes-nous ?"></a>
<a style="left:65%;width:10%" href="#formulaire" aria-label="Formulaire"></a>
<a style="left:75%;width:10%" href="#contact" aria-label="Contact"></a>
<a style="left:86%;width:11%" href="#contact" aria-label="Contact"></a>
</nav>

<img class="page-img" src="assets/home.jpg" width="2048" height="3072" fetchpriority="high" alt="Page d'accueil EMG : Rétro par passion. Immersif par vision.">
<!-- header -->
<!-- main buttons -->
<a class="hot" style="left:10.5%;top:28.7%;width:18%;height:3.3%" href="#entreprise"></a>
<a class="hot" style="left:30%;top:28.7%;width:20%;height:3.3%" href="#produits"></a>
<a class="hot" style="left:48%;top:53.8%;width:22%;height:3.2%" href="#entreprise"></a>
<a class="hot" style="left:7%;top:68%;width:14%;height:3%" href="#entreprise"></a>
<a class="hot" style="left:68%;top:68%;width:14%;height:3%" href="#produits"></a>
<a class="hot" style="left:73%;top:91.2%;width:19%;height:4%" href="#contact"></a>
</section>

<a class="hot" style="left:35.8%;top:36%;width:29%;height:14.5%" href="#product-2"></a>
<a class="hot" style="left:67%;top:36%;width:29%;height:14.5%" href="#product-3"></a>
<a class="hot" style="left:4%;top:51%;width:29%;height:14.5%" href="#product-4"></a>
<a class="hot" style="left:35.8%;top:51%;width:29%;height:14.5%" href="#product-5"></a>
<a class="hot" style="left:67%;top:51%;width:29%;height:14.5%" href="#product-6"></a>
<a class="hot" style="left:4%;top:66%;width:29%;height:14.5%" href="#product-7"></a>
<a class="hot" style="left:35.8%;top:66%;width:29%;height:14.5%" href="#product-8"></a>
<a class="hot" style="left:67%;top:66%;width:29%;height:14.5%" href="#product-9"></a>
</section>

<!-- Functional contact form overlays aligned to the form shown in the supplied mockup -->
<form id="contactForm" onsubmit="submitContact(event)">
<input class="form-input" style="left:47.5%;top:74.55%;width:22.8%;height:1.95%" name="prenom" placeholder="Ex : Léa" required>
<input class="form-input" style="left:71.4%;top:74.55%;width:22.9%;height:1.95%" name="email" type="email" placeholder="Ex : lea@mail.com" required>
<select class="form-select" style="left:47.5%;top:78.2%;width:46.8%;height:1.95%" name="experience" required>
<option value="">Choisis une option</option><option>Visite du complexe</option><option>Événement</option><option>Achat d'un produit</option><option>Session VR</option>
</select>
<textarea class="form-message" style="left:47.5%;top:81.85%;width:46.8%;height:3.7%" name="avis" placeholder="Partage ton expérience, ce que tu as aimé, ce qui pourrait être amélioré..." required></textarea>
<div style="position:absolute;left:75%;top:86.9%;width:19.4%;height:3%;z-index:21">
<button class="hot" type="submit" style="inset:0;border:0;background:transparent"></button>
</div>

<div id="detail" class="detail-wrap">
<img data-src="assets/produits-details.jpg" width="2048" height="3072" alt="Fiches produits EMG">
<div id="detailZones"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const pages=['home','entreprise','produits','boutique','equipe','contact'];
const titles={home:'EMG · Rétro par passion. Immersif par vision.',entreprise:'Notre entreprise · EMG',produits:'Nos produits · EMG',boutique:'EMG Reims, notre complexe · EMG',equipe:'Qui sommes-nous ? · EMG',contact:'Contact · EMG',detail:'Fiches produits · EMG'};
// ancres à l'intérieur d'une page : [page, position verticale dans la maquette]
const anchors={formulaire:['contact',.705],'contact-form':['contact',.275]};
const bar=document.getElementById('bar');
function load(el){const i=el.querySelector('img[data-src]');if(i){i.src=i.dataset.src;i.removeAttribute('data-src');}return el.querySelector('img');}
function setPage(id,frac){
  const isDetail=/^product-\d+$/.test(id);
  const el=isDetail?document.getElementById('detail'):(document.getElementById(id)||document.getElementById('home'));
  document.querySelectorAll('.page,.detail-wrap').forEach(p=>p.classList.toggle('active',p===el));
  const img=load(el);
  const head=isDetail?load(document.getElementById('produits')):img;
  bar.style.backgroundImage='url("'+head.getAttribute('src')+'")';
  document.title=titles[isDetail?'detail':el.id]||titles.home;
  const go=()=>window.scrollTo({top:frac?Math.max(0,el.offsetTop+el.offsetHeight*frac-bar.offsetHeight-12):0,behavior:frac?'smooth':'instant'});
  go(); if(frac&&!img.complete) img.addEventListener('load',go,{once:true});
}
function route(){
  let id=location.hash.slice(1)||'home';
  if(anchors[id]) return setPage(anchors[id][0],anchors[id][1]);
  if(!pages.includes(id) && !/^product-\d+$/.test(id)) id='home';
  setPage(id);
}
function submitContact(e){
  e.preventDefault();
  const toast=document.getElementById('toast');
  toast.textContent='Merci ! Ton avis a bien été saisi.';
  toast.style.display='block'; e.target.reset();
  setTimeout(()=>toast.style.display='none',3500);
}
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>bar.classList.toggle('scrolled',scrollY>8),{passive:true});
route();
// les autres pages se chargent en arrière-plan : les clics suivants sont instantanés
window.addEventListener('load',()=>{const q=[...document.querySelectorAll('img[data-src]')];
  (function next(){const i=q.shift();if(!i)return;if(!i.dataset.src)return next();const p=new Image();p.onload=p.onerror=next;p.src=i.dataset.src;})();});

const zones=document.getElementById('detailZones');
for(let i=0;i<9;i++){
  const a=document.createElement('a');
  const r=Math.floor(i/3),c=i%3;
  a.className='detail-hot';
  a.href='#produits'; a.setAttribute('aria-label','Retour aux produits');
  a.style.left=(c*33.333)+'%'; a.style.top=(r*33.333)+'%';
  a.style.width='33.333%'; a.style.height='4%';
  zones.appendChild(a);
}
</script>
</body>
</html>
